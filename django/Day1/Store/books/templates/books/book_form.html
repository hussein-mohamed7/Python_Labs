{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h3 class="mb-3">
            {% if book %} Edit Book {% else %} Add New Book {% endif %}
        </h3>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       value="{{ book.title }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Author</label>
                <input type="text"
                       name="author"
                       class="form-control"
                       value="{{ book.author }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number"
                       name="price"
                       class="form-control"
                       value="{{ book.price }}">
            </div>

            <button class="btn btn-success">
                Save
            </button>

            <a href="{% url 'books:book-list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
