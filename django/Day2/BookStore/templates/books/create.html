{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Book</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="form-card">

    <h2>Create Book</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="title" placeholder="Book Title" required>

        <textarea name="desc" placeholder="Book Description" rows="5"></textarea>

        <input type="number" step="0.1" name="rate" placeholder="Rate (e.g 4.5)">

        <input type="number" name="views" placeholder="Views">

        <button type="submit">Create</button>
                <a class="btn add-btn" href="{% url 'book_list' %}" style= " margin-top : 12px">
            back
        </a>

    </form>

</div>

</body>
</html>
