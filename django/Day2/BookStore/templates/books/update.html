{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Book</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="form-card">

    <h2>Update Book</h2>

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="title"
            value="{{ book.title }}"
            placeholder="Book Title"
            required
        >

        <textarea
            name="desc"
            placeholder="Book Description"
            rows="5"
        >{{ book.desc }}</textarea>

        <input
            type="number"
            step="0.1"
            name="rate"
            value="{{ book.rate }}"
            placeholder="Rate"
        >

        <input
            type="number"
            name="views"
            value="{{ book.views }}"
            placeholder="Views"
        >

        <button type="submit">Update</button>
        <a class="btn add-btn" href="{% url 'book_list' %}" style= " margin-top : 12px">
            back
        </a>

    </form>

</div>

</body>
</html>
